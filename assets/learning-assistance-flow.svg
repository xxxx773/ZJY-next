<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ZJY Next 学习辅助流程</title>
  <desc id="desc">从绑定账号、同步课程、查看任务，到学习辅助、用户核对和查看学习记录的流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e3a5f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .label { font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .caption { font-size: 14px; fill: #475569; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" font-size="28" font-weight="700">ZJY Next · 学习辅助流程</text>
  <text x="600" y="84" class="caption">以课程信息与用户自主核对为核心的学习工作流</text>

  <path class="line" d="M243 205 H307"/>
  <path class="line" d="M463 205 H527"/>
  <path class="line" d="M683 205 H747"/>
  <path class="line" d="M903 205 H957"/>

  <g filter="url(#shadow)">
    <rect x="80" y="150" width="163" height="110" rx="18" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="300" y="150" width="163" height="110" rx="18" fill="#dcfce7" stroke="#4ade80"/>
    <rect x="520" y="150" width="163" height="110" rx="18" fill="#fef3c7" stroke="#fbbf24"/>
    <rect x="740" y="150" width="163" height="110" rx="18" fill="#ede9fe" stroke="#a78bfa"/>
    <rect x="960" y="150" width="163" height="110" rx="18" fill="#ffe4e6" stroke="#fb7185"/>
  </g>

  <text x="161" y="190" class="label">绑定学习账号</text>
  <text x="161" y="218" class="caption">统一管理账号信息</text>
  <text x="381" y="190" class="label">同步课程与任务</text>
  <text x="381" y="218" class="caption">查看学习进度</text>
  <text x="601" y="190" class="label">学习辅助</text>
  <text x="601" y="218" class="caption">内容整理与参考</text>
  <text x="821" y="190" class="label">用户核对</text>
  <text x="821" y="218" class="caption">自主完成学习任务</text>
  <text x="1041" y="190" class="label">学习记录</text>
  <text x="1041" y="218" class="caption">查看进度与反馈</text>

  <text x="600" y="338" text-anchor="middle" font-size="16" fill="#475569">学习辅助仅提供参考，具体学习与提交操作由用户自行确认。</text>
</svg>
